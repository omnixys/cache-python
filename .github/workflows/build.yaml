name: Build

on:
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.14"

jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check src/

      - name: Typecheck (mypy)
        run: uv run mypy src/ || true

      - name: Test (pytest)
        run: uv run pytest
